<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0f0e">
<title>Strap</title>
<!-- Inline so the page makes zero external requests. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%2318c98b' stroke-width='5' stroke-dasharray='61 82' stroke-linecap='round' transform='rotate(-90 16 16)'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <h1>Today</h1>
    <button id="day-prev" class="ghost-btn" aria-label="Previous day">&#8249;</button>
    <button id="day-next" class="ghost-btn" aria-label="Next day">&#8250;</button>
  </div>
  <p id="day-label" class="day-label">&nbsp;</p>
</header>

<main id="main">

  <!-- connection / data-state banner -->
  <div id="banner" class="banner hidden" role="status"></div>

  <!-- recovery ring -->
  <section class="ring-card" id="ring-card">
    <svg viewBox="0 0 200 200" class="ring" aria-hidden="true">
      <circle cx="100" cy="100" r="86" class="ring-track"/>
      <circle cx="100" cy="100" r="86" class="ring-value" id="ring-arc"/>
    </svg>
    <div class="ring-centre">
      <span class="ring-num" id="ring-num">--</span>
      <span class="ring-unit" id="ring-unit">%</span>
      <span class="ring-cap" id="ring-cap">Recovery</span>
    </div>
  </section>

  <!-- metric tiles -->
  <section class="tiles" id="tiles" aria-label="Today's metrics"></section>

  <!-- sleep stages -->
  <section class="card" id="sleep-card">
    <div class="card-head">
      <h2>Sleep stages</h2>
      <span class="pill approx">approximate</span>
    </div>
    <div class="stage-bar" id="stage-bar"></div>
    <ul class="stage-legend" id="stage-legend"></ul>
  </section>

  <!-- heart rate today -->
  <section class="card" id="hr-card">
    <div class="card-head">
      <h2>Heart rate</h2>
      <span class="pill measured">measured</span>
    </div>
    <svg id="hr-spark" class="spark" viewBox="0 0 600 140" preserveAspectRatio="none"></svg>
    <p class="card-note" id="hr-note"></p>
  </section>

  <!-- strap / BLE state -->
  <section class="card" id="strap-card">
    <div class="card-head"><h2>Strap</h2></div>
    <p class="strap-state"><span class="dot" id="strap-dot"></span><span id="strap-text">checking…</span></p>
    <p class="card-note" id="strap-note"></p>
  </section>

  <details class="card diag">
    <summary>Data sources &amp; diagnostics</summary>
    <div id="diag-body" class="diag-body">loading…</div>
  </details>

  <p class="disclaimer" id="disclaimer"></p>
  <p class="build">Phase 1 — read-only dashboard. Trends, journal, workouts and
     strap alarms are not built yet.</p>
</main>

<!-- metric detail sheet -->
<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet-panel">
    <div class="sheet-grab"></div>
    <h3 id="sheet-title"></h3>
    <p id="sheet-kind" class="sheet-kind"></p>
    <p id="sheet-method" class="sheet-method"></p>
    <p id="sheet-note" class="sheet-note"></p>
    <button id="sheet-close" class="big-btn">Close</button>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
